[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "firmwaretrust"
version = "0.1.0"
description = "Software-first firmware integrity, signing and release verification toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["cryptography>=42.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0", "ruff>=0.5.0"]

[project.scripts]
firmwaretrust = "firmwaretrust.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/firmwaretrust"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
