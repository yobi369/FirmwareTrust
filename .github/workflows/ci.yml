name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run tests
        run: pytest --cov=firmwaretrust --cov-report=term-missing
      - name: Validate browser application syntax
        if: matrix.python-version == '3.13'
        run: node --check app.js && node --check enterprise.js && node --check api/config.js
      - name: Lint
        if: matrix.python-version == '3.13'
        run: ruff check .

  edge-function-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test SBOM normalization and OSV mapping
        run: deno test supabase/functions/ingest-sbom/sbom_test.ts
      - name: Type-check Supabase Edge Functions
        run: deno check supabase/functions/key-status/index.ts supabase/functions/register-release/index.ts supabase/functions/ingest-sbom/index.ts
